<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: producer column with tabs, comment rows and a footer comment box (synthetic)</title>
<style>
  body { font-family: sans-serif; font-size: 14px; margin: 0; }
  .page { display: flex; width: 1200px; }
  .stage { width: 800px; }
  .stage .who { display: flex; gap: 6px; padding: 4px; }
  .column { width: 400px; }
  .host { display: flex; gap: 6px; height: 40px; align-items: center; }
  #panel { width: 400px; height: 600px; display: flex; flex-direction: column; }
  #tabs { height: 42px; display: flex; }
  #tabs [role="tab"] { flex: 1; line-height: 42px; text-align: center; }
  #list { height: 482px; overflow-y: auto; padding: 0 24px; box-sizing: border-box; }
  .r { display: flex; gap: 8px; width: 352px; min-height: 30px; align-items: center; }
  img.av { width: 24px; height: 24px; }
  footer { height: 76px; width: 400px; box-sizing: border-box; }
  footer .w { height: 100%; }
  footer textarea { width: 300px; height: 40px; }
</style>
</head>
<body>
<!--
  What the reader met in a live run (sizes from the sanitised debug capture, everything else made up):
  a 400x600 box holding a tab list (two tabs that do not say which one is selected), a section with
  the comment rows, and a footer with the comment box four parents down. No tab panel role, no labels.
-->
<div class="page">
  <div class="stage">
    <!-- Other people on the page, outside the comments column. -->
    <div class="who"><img class="av" alt="fixture_guest_a's profile picture" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><span>fixture_guest_a</span><span>waiting room</span></div>
    <div class="who"><img class="av" alt="fixture_guest_b's profile picture" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><span>fixture_guest_b</span><span>waiting room</span></div>
  </div>
  <div class="column" id="column">
    <div class="host"><img class="av" alt="fixture_host's profile picture" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><span>fixture_host</span><span>on air</span></div>
    <div id="panel">
      <div role="tablist" id="tabs">
        <div role="tab" tabindex="0" id="tab-comments">Comments</div>
        <div role="tab" tabindex="0" id="tab-details">Details</div>
      </div>
      <section id="list"></section>
      <footer id="footer">
        <div class="w"><div class="w"><div class="w"><textarea id="composer" placeholder="Add a comment…"></textarea></div></div></div>
      </footer>
    </div>
  </div>
</div>
<script>
  const AV = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  // Test helpers: add a comment row or a "joined" line, count clicks on the tabs.
  window.__clicks = 0;
  for (const tab of document.querySelectorAll('[role="tab"]')) tab.onclick = () => { window.__clicks++; };
  window.__add = (user, text, join) => {
    const row = document.createElement('div');
    row.className = 'r';
    row.innerHTML = '<img class="av" alt="' + user + '\'s profile picture" src="' + AV + '"><div><span class="u"></span> <span class="t"></span></div>';
    row.querySelector('.u').textContent = user;
    row.querySelector('.t').textContent = join ? 'joined' : text;
    document.getElementById('list').appendChild(row);
  };
  // 26 rows, as in the run: 22 comments and 4 "joined" lines.
  const users = ['fixture_user_a', 'fixture_user_b', 'fixture_user_c', 'fixture_user_d', 'fixture_user_e'];
  for (let i = 0; i < 26; i++) {
    const user = users[i % users.length];
    if (i % 7 === 3) window.__add(user, '', true);
    else window.__add(user, 'made-up comment number ' + (i + 1));
  }
</script>
</body>
</html>
